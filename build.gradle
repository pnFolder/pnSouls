plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.10'
    id 'com.gradleup.shadow' version '8.3.9'
}

group = 'ru.privatenull'
version = '1.0.1'

base {
    archivesName = 'pnSouls'
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

def pnLibraryVersion = '0.0.1-dev.6'

dependencies {
    compileOnly 'com.destroystokyo.paper:paper-api:1.16.5-R0.1-SNAPSHOT'
    compileOnly 'com.mojang:authlib:1.5.25'
    compileOnly 'net.dmulloy2:ProtocolLib:5.4.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.10'
    // Общий рантайм ставит bootstrap, зашитый в jar; для компиляции нужен только публичный API.
    implementation "io.github.pnfolder:pnlibrary-bootstrap-bukkit:${pnLibraryVersion}"
    compileOnly "io.github.pnfolder:pnlibrary-api:${pnLibraryVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.yaml:snakeyaml:1.28'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

configurations.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.shadowJar {
    archiveClassifier.set('')
    archiveFileName.set("pnSouls-${project.version}.jar")
    mergeServiceFiles()
    relocate 'org.pnfolder.pnlibrary.bootstrap', 'ru.privatenull.pnsouls.libs.pnbootstrap'
    relocate 'org.pnfolder.pnlibrary.bukkit.bootstrap', 'ru.privatenull.pnsouls.libs.pnbootstrap.bukkit'
    relocate 'org.pnfolder.pnlibrary.console', 'ru.privatenull.pnsouls.libs.pnbootstrap.console'
    relocate 'kotlin', 'ru.privatenull.pnsouls.libs.kotlin'
}

tasks.jar {
    archiveClassifier.set('plain')
}

tasks.build {
    dependsOn tasks.shadowJar
}

tasks.processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}
