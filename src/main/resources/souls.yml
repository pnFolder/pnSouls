# =============================================================================
#                              НАСТРОЙКА ДУШ
# =============================================================================
# Ключ под souls — технический ID. aliases — русские названия для команд и tab-complete.
# Выдавать можно по ID или алиасу: /souls give <игрок> <id/алиас>.
# Чтобы создать свою душу, скопируйте любой раздел целиком и замените его ID.
# Души полностью виртуальны и физически не появляются в руках или инвентаре игрока.
# model.head, model.chest и model.hand видны ТОЛЬКО на невидимом ArmorStand.
# Выдача: /pnsouls give <игрок> <id>. Выбор души выполняется кликом в /souls.
#
# МОДЕЛЬ НЕВИДИМОГО ARMORSTAND
# model.head  — предмет на голове визуального ArmorStand.
# model.chest — видимая броня; model.hand — видимый предмет в правой руке.
# hand-pose: "x,y,z" — поворот правой руки в градусах.
# custom-model-data необязателен и используется ресурс-паком.
# Для кожаной брони доступен color: "R,G,B".
#
# СВОЯ BASE64-ГОЛОВА
# Вместо material у model.head можно написать:
# head:
#   base64: "полный Base64, textures.minecraft.net URL или хеш текстуры"
#   custom-model-data: 3101
# Если одновременно заданы base64 и material, приоритет всегда у base64.
#
# ЭФФЕКТЫ И СПОСОБНОСТИ
# potion-effects: {GLOWING: 1, NIGHT_VISION: 1}
# Уровень 1 = I, 2 = II. Используются Bukkit-названия эффектов.
# abilities.mob-drops: {multiplier: 2.0, chance: 0.25} — множитель и шанс дропа.
# abilities.mob-experience-multiplier: 3.0 — множитель опыта с мобов.
# abilities.infinite-food: true — вечная сытость.
# abilities.crop-growth: {enabled: true, radius: 4} — рост культур при каждом шаге.
# Вероятности отдельных культур находятся в config.yml.
#
# СЛЕД ЗА ДУШОЙ
# trail.enabled: true/false — включить или отключить след.
# particle — Bukkit-тип частицы. DUST/REDSTONE поддерживает настраиваемый RGB-цвет.
# color: "R,G,B"; size — размер цветной частицы; count — количество за импульс.
# spread — разброс; height-offset — высота следа от ног ArmorStand;
# back-offset — отступ назад по фактическому направлению движения души;
# interval-ticks — интервал появления частиц в тиках.
#
# ПРИМЕР НОВОЙ ДУШИ
# souls:
#   miner:
#     name: "&#55FFFFДуша Шахтёра"
#     model:
#       head: {base64: "...", custom-model-data: 3110}
#       chest: {material: IRON_CHESTPLATE, custom-model-data: 3210}
#       hand: {material: DIAMOND_PICKAXE, custom-model-data: 3310}
#       hand-pose: "-20,0,-15"
#     lore: ["&7Описание", "", "&bПКМ, чтобы активировать"]
#     potion-effects: {FAST_DIGGING: 2, GLOWING: 1}
# =============================================================================

